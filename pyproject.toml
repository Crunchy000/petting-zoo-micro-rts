[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "microrts-pz"
version = "0.1.0"
description = "MicroRTS as a PettingZoo environment: a pure-Python port of the MicroRTS engine with the Gym-MicroRTS gridnet interface and a browser viewer"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "petting-zoo-micro-rts contributors" }]
keywords = ["reinforcement-learning", "multi-agent", "pettingzoo", "microrts", "rts", "gymnasium"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]
dependencies = [
    "numpy>=1.24",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]
fast = ["numba>=0.60"]
train = ["torch>=2.1", "numba>=0.60"]
jax = ["jax>=0.4.30"]

[project.urls]
"MicroRTS" = "https://github.com/Farama-Foundation/MicroRTS"
"MicroRTS-Py" = "https://github.com/Farama-Foundation/MicroRTS-Py"

[tool.setuptools.packages.find]
include = ["microrts_pz*"]

[tool.setuptools.package-data]
microrts_pz = ["maps/**/*.xml", "render/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:pettingzoo.*"]
