name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q

  parity:
    # Plays random games through this engine and the reference Java MicroRTS
    # engine side by side and fails on the first differing observation, mask,
    # reward, resource count or game-over flag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Farama-Foundation/MicroRTS
          ref: 72f2fd94039adf3323f4591947e98661a572f927
          path: MicroRTS
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python tools/parity/check_parity.py --microrts MicroRTS --episodes 1 --steps 1000
